<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵屿 2.0 机构端演示 v1.5</title><style>/* ===== 灵屿 2.0 机构端：沿用学生端（1.0）的组件语言，换成冷调青绿以区分 ===== */
:root{
  --bg:#F0F1EC; --card:#FBFBF8; --white:#fff;
  --ink:#2E3A3C; --ink2:#566265; --mute:#8A9497; --mute2:#6F7A7D;
  --line:#D4DAD6; --line2:#E4E8E3;
  --pri:#2F5D62; --pri2:#3E7379; --pri-t:#EAF4F2; --soft:#E3EEEC; --soft2:#D3E5E1; --bub:#EEF1EC; --pale:#F7FAF8;
  --brand:#F2C14E; --side:#1E3337; --side2:#284449;
  --ok:#4C7A4A; --ok-bg:#E6F0E2; --warn:#A8601A; --warn-bg:#FBF0E1; --crit:#B4432E; --crit-bg:#FBEAE6; --crit-line:#EBC3B9;
  --l5:#B4432E; --l4:#D9822B; --l3:#C9A227; --l2:#5F9787; --l1:#A3ADAF;
  --r-lg:18px; --r-md:12px; --r-sm:8px; --shadow:0 10px 30px rgba(30,51,55,.07);
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 "PingFang SC","Noto Sans SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}img{display:block}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.ic.s{width:15px;height:15px}.ic.l{width:24px;height:24px}
/* 演示栏 */
.demo{position:fixed;top:0;left:0;right:0;height:40px;z-index:200;background:#1A2426;color:#DDE6E4;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:12px}
.demo b{color:var(--brand)}.demo select{height:26px;border-radius:6px;border:1px solid #3c4f52;background:#25363a;color:#eef3f2;padding:0 6px;font-size:12px}
.demo .sp{flex:1}.demo button,.demo label{height:26px;padding:0 10px;border:1px solid #3c4f52;border-radius:6px;color:#eef3f2;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.demo button:hover{background:#25363a}.demo .memo-btn{background:#FFF3B8!important;border-color:#E6CF6B!important;color:#6b5a14!important}
.zap{display:none;align-items:center;gap:4px;border:1px dashed var(--warn);color:var(--warn);background:rgba(242,193,78,.12);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
body.demo-on .zap{display:inline-flex}
.memo{position:fixed;right:16px;top:48px;z-index:150;width:330px;max-height:70vh;overflow:auto;background:#FFF8CF;border:1px solid #E6CF6B;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;font-size:13px;color:#4d4316}
.memo h4{margin:0 0 6px}.memo ul{margin:0;padding-left:18px}.memo li{margin:3px 0}
/* 框架 */
#app{padding-top:40px;height:100vh;display:flex;overflow:hidden}
.side{width:216px;flex:none;background:var(--side);color:#C9D7D5;display:flex;flex-direction:column;padding:14px 10px}
.side .lg{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}.side .lg img{width:34px;height:34px;border-radius:9px;background:#fff}
.side .lg b{display:block;color:#fff;letter-spacing:2px;font-size:15px}.side .lg small{color:#8FA9A6;font-size:11.5px}
.side nav button{width:100%;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:9px;color:#C9D7D5;margin-bottom:2px}
.side nav button:hover{background:var(--side2);color:#fff}.side nav button.on{background:var(--pri2);color:#fff;font-weight:600}
.side nav .cnt{margin-left:auto;font-size:11px;min-width:20px;height:18px;border-radius:9px;background:rgba(255,255,255,.14);display:grid;place-items:center;padding:0 6px}
.side nav .cnt.r{background:var(--crit);color:#fff}
.side .who{margin-top:auto;border-top:1px solid #2f4a4f;padding:12px 8px 2px;font-size:12px;color:#8FA9A6}.side .who b{display:block;color:#fff;font-size:13px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:58px;flex:none;background:var(--card);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:14px;padding:0 24px}
.top h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.5px}.top .sp{flex:1}
.disc{font-size:11.5px;color:var(--mute2);background:var(--bub);border-radius:6px;padding:2px 8px}
.srch{display:flex;align-items:center;gap:6px;height:34px;width:220px;border:1px solid var(--line);border-radius:9px;padding:0 10px;color:var(--mute);background:#fff}.srch input{border:0;outline:0;flex:1;min-width:0;background:none}
.page{flex:1;overflow:auto;padding:22px 26px 60px}
.fade{animation:fade .18s ease-out}@keyframes fade{from{opacity:0}}
/* 组件 */
.btn{height:36px;border-radius:9px;padding:0 14px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:filter .15s,background .15s}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{filter:brightness(1.12)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.sec:hover{border-color:#b9c2be}
.btn.soft{background:var(--soft);color:var(--pri)}.btn.soft:hover{background:var(--soft2)}
.btn.ghost{color:var(--ink2)}.btn.ghost:hover{background:var(--bub)}
.btn.red{background:var(--crit);color:#fff}.btn.xs{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}.card h3 .sp{flex:1}.card h3 small{font-weight:400;color:var(--mute2);font-size:12.5px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card);border:1px solid var(--line2);border-radius:var(--r-md);padding:14px 16px;text-align:left}.kpi small{color:var(--mute2);font-size:12px;display:block}.kpi b{font-size:24px;font-weight:600;letter-spacing:.5px}.kpi span{font-size:12px;color:var(--mute2);margin-left:6px}
button.kpi:hover{border-color:var(--pri2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}.tabs button i{font-style:normal;font-size:11px;background:rgba(0,0,0,.08);border-radius:8px;padding:0 6px}.tabs button.on i{background:rgba(255,255,255,.2)}.tabs button i.r{background:var(--crit);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px}.t th{text-align:left;font-weight:500;color:var(--mute2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}.t tr:last-child td{border-bottom:0}
.t tr.hov{cursor:pointer}.t tr.hov:hover td{background:var(--pale)}.t td small{display:block;color:var(--mute2);font-size:11.5px}
.t tr.crit td:first-child{box-shadow:inset 3px 0 var(--crit)}.t tr.sel td{background:var(--soft)}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}.lv b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;color:#fff;font-size:11.5px}
.sig{letter-spacing:1px;font-size:10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--bub);color:var(--ink2);white-space:nowrap}
.pill.p{background:var(--soft);color:var(--pri)}.pill.r{background:var(--crit-bg);color:var(--crit)}.pill.w{background:var(--warn-bg);color:var(--warn)}.pill.g{background:var(--ok-bg);color:var(--ok)}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 6px;margin:1px 3px 1px 0;color:var(--ink2);background:#fff}
.due{font-size:12.5px;white-space:nowrap}.due.r{color:var(--crit);font-weight:600}.due.w{color:var(--warn)}
.empty{text-align:center;color:var(--mute2);padding:30px 0;font-size:13px}.empty img{width:52px;height:52px;border-radius:12px;margin:0 auto 10px;opacity:.85}
.head{display:flex;align-items:flex-start;gap:14px;background:var(--crit-bg);border:1px solid var(--crit-line);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:16px}
.head.n{background:var(--pri-t);border-color:var(--soft2)}.head .ic{color:var(--crit);margin-top:2px}.head.n .ic{color:var(--pri)}
.head .grow{flex:1}.head b{display:block;font-size:15px}.head small{color:var(--ink2)}.head .cd{font-variant-numeric:tabular-nums;font-weight:600;color:var(--crit)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.filters select,.filters input{height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri2);border-radius:4px}
.hb{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:12.5px;margin:7px 0}.hb span:last-child{text-align:right;color:var(--mute2)}
.note{font-size:12px;color:var(--mute2)}
/* 抽屉：学生档案 */
.dw-ov{position:fixed;inset:40px 0 0;background:rgba(30,51,55,.28);z-index:90;animation:fade .15s}
.dw{position:fixed;top:40px;right:0;bottom:0;width:min(880px,94vw);background:var(--bg);z-index:95;display:flex;flex-direction:column;box-shadow:-12px 0 30px rgba(0,0,0,.12);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.5}}
.dw .dh{background:var(--card);border-bottom:1px solid var(--line2);padding:16px 22px;display:flex;gap:14px;align-items:flex-start}
.dw .dh .grow{flex:1}.dw .dh h2{margin:0;font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.dw .dh p{margin:4px 0 0;color:var(--mute2);font-size:12.5px}
.dw .acts{background:var(--pri-t);border-bottom:1px solid var(--soft2);padding:10px 22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dw .acts small{color:var(--pri);font-weight:600;margin-right:4px}
.dw .db{flex:1;overflow:auto;padding:16px 22px 40px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px}.kv span{color:var(--mute2)}
.rep h4{margin:16px 0 8px;font-size:14px}.rep table.t td:first-child{width:110px;color:var(--mute2);white-space:nowrap}
.locked{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--mute2);background:var(--bub);border-radius:12px;padding:26px;font-size:13px}
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;margin-bottom:12px;font-size:13px}.tl div:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--pri2)}
.tl div.r:before{border-color:var(--crit)}.tl small{display:block;color:var(--mute2);font-size:11.5px}
.msg{display:flex;gap:10px;margin:10px 0;font-size:13px}.msg img{width:28px;height:28px;border-radius:8px}.msg .bb{background:#fff;border:1px solid var(--line2);border-radius:4px 12px 12px 12px;padding:8px 12px;max-width:80%}
.msg.me{justify-content:flex-end}.msg.me .bb{background:var(--soft);border-color:var(--soft2);border-radius:12px 4px 12px 12px}.msg .bb mark{background:#FFE7A3;padding:0 2px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
/* 弹窗 */
.ov{position:fixed;inset:40px 0 0;background:rgba(30,51,55,.34);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.mo{width:min(560px,100%);max-height:calc(100vh - 90px);overflow:auto;background:var(--card);border-radius:18px;padding:24px 26px 20px;box-shadow:0 24px 60px rgba(0,0,0,.2);animation:rise .2s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.mo h3{margin:0 0 6px;font-size:18px}.mo p{color:var(--ink2);margin:0 0 12px;font-size:13.5px}.mo .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.fld{margin-bottom:12px}.fld>label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px}.fld select,.fld textarea,.fld input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}.fld textarea{min-height:70px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opts button{border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;background:#fff}.opts button.on{border-color:var(--pri);background:var(--soft);color:var(--pri);font-weight:600}
.toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:300;background:var(--side);color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:rise .2s}
/* 排班 */
.sch{display:grid;grid-template-columns:70px repeat(5,1fr);gap:4px;font-size:12px}.sch>div{padding:6px;text-align:center}.sch .hd{color:var(--mute2)}
.sch button{height:34px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px}.sch button.open{background:var(--soft);border-color:var(--pri2);color:var(--pri)}.sch button.bk{background:var(--warn-bg);border-color:#e6c49a;color:var(--warn);cursor:default}
.sw{position:relative;width:34px;height:20px;border-radius:10px;background:var(--line);display:inline-block;vertical-align:middle;transition:.15s}.sw:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--pri2)}.sw.on:after{left:16px}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.wave{display:flex;gap:10px}.wave>div{flex:1;border:1px solid var(--line2);border-radius:12px;padding:12px;background:#fff}.wave .on{border-color:var(--pri2);background:var(--pale)}.wave b{display:block}
.chk{display:grid;gap:6px;margin:8px 0}.chk div{display:flex;gap:8px;align-items:center;font-size:13px}.chk .x{color:var(--crit)}.chk .v{color:var(--ok)}
@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}}

.na *{animation:none!important}
.demo .zap{display:none}body.demo-on .demo .zap{display:inline-flex}
.dw .db>.tabs{position:sticky;top:-16px;z-index:3;background:var(--bg);margin:-16px -22px 14px;padding:14px 22px 10px}
/* v2 */
.kv>b{font-weight:400}
.side .who{display:flex;gap:10px;align-items:center}.side .who span{display:block;font-size:12px;opacity:.75}
.who-acts{display:flex;gap:6px;padding:0 16px 16px}.who-acts button{flex:1;height:30px;border:1px solid #3c5559;border-radius:8px;color:#d5e2df;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:4px}.who-acts button:hover{background:var(--side2)}
.bell{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center}.bell i{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 4px}
.npanel{position:absolute;right:24px;top:96px;z-index:80;width:440px;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.16);padding:14px 16px}
.npanel .nh{display:flex;align-items:center;gap:6px;margin-bottom:8px}.npanel .nh .sp{flex:1}.npanel .nh button{font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--line)}.npanel .nh button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ni{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}.ni>div{flex:1}.ni small{display:block;color:var(--mute2);font-size:11.5px}.ni.un{font-weight:600}
.main{position:relative}
.login{min-height:calc(100vh - 40px);width:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--side) 0%,#2a4a4f 55%,var(--bg) 55%);padding:30px 16px}
.lbox{width:min(520px,100%);background:var(--card);border-radius:22px;padding:30px 32px;box-shadow:0 30px 80px rgba(0,0,0,.18)}.lbox h2{margin:18px 0 4px;font-size:20px}
.lg2{display:flex;gap:12px;align-items:center}.lg2 img{width:48px;height:48px;border-radius:12px}.lg2 b{font-size:18px;display:block}.lg2 small{color:var(--mute2)}
.accs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acc{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%;margin-bottom:8px}.acc:hover{border-color:var(--pri2)}.acc.on{border-color:var(--pri);background:var(--pri-t)}.acc b{display:block;font-size:13.5px}.acc small{display:block;font-size:11.5px;color:var(--mute2);line-height:1.4}
.acc .av,.av0{width:34px;height:34px;border-radius:50%;flex:none}.av0{background:var(--soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:600}
.code{display:flex;gap:8px;justify-content:center;margin:18px 0}.code span{width:44px;height:52px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;background:#fff}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--pri-t);border:1px solid var(--soft2);color:var(--pri);border-radius:16px;padding:4px 6px 4px 12px;font-size:12.5px;margin-bottom:10px}.chip button{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--mute2)}
.ccard{display:block;width:100%;text-align:left;margin-bottom:8px}.ccard.on{border-color:var(--crit)}.ccard small{display:block;color:var(--mute2)}
.crow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2)}.crow small{display:block;color:var(--mute2)}
.opts button.warn{border-color:var(--crit-line);color:var(--crit)}
.dbox{background:var(--warn-bg);border:1px solid #ecd2ad;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px}.dbox p{margin:4px 0 0;color:var(--ink2)}
.recbox{background:var(--pale);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}.recbox p{margin:4px 0}.recbox small{color:var(--mute2)}
.dw .acts.ro{background:var(--bg)}
.sw.lk{opacity:.4;cursor:not-allowed!important;position:relative}
.sch button.chg{outline:2px dashed var(--warn);outline-offset:-3px}.sch button.past{opacity:.4;cursor:default}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
.mrow{display:flex;width:100%;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;align-items:center;gap:6px}.mrow span{flex:1;text-align:left}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.mo textarea,.mo input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.who-acts button{white-space:nowrap;font-size:11.5px;padding:0 6px}
/* v1.3 小屿助理 */
.brief{background:linear-gradient(180deg,#FFFDF3,var(--card));border:1px solid #EADFAE;border-radius:var(--r-lg);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.brief .bh{display:flex;gap:10px;align-items:center}.brief .bh img{width:38px;height:38px;border-radius:10px}.brief .bh b{display:block;font-size:15px}.brief .bh small{color:var(--mute2);font-size:12px}
.brief .greet{margin:10px 0 4px;font-size:14.5px;color:var(--ink)}

    <div class="rule">${lvB(4)}<p>直接交给<b>初级咨询师</b>复核，${hs('lim.review4', [24, 48, 72], RULES.lim.review4)}内完成。想往下调等级，要中心负责人同意。</p></div>

    <div class="rule">${lvB(2)}<p>由<b>辅导员</b>核验，${hs('lim.verify2', [72, 120, 168], RULES.lim.verify2)}内完成，然后每 30 天随访一次。随机抽 ${sel('samp2', [0, 5, 10, 15, 20], RULES.samp2, ed)}% 给咨询师复查，防止漏掉。</p></div>

    <details class="adv"><summary>查看完整权限对照表</summary><table class="t matrix"><tr><th>权限</th><th>L1 核验</th><th>L2 复核</th><th>L3 决策</th><th>系统管理员</th></tr>${PERMS.map((p) => `<tr><td>${p[0]}</td>${[1, 2, 3, 4].map(j => `<td>${p[j] ? '✓' : '—'}</td>`).join('')}</tr>`).join('')}</table></details>`; }

  if (tab === 'audit') { const cat = S.f.acat || '';

/* ---------- 弹窗（文本框回显 S.form，重绘不丢字） ---------- */
const OBS = () => S.role === 'L1s' ? ['和同学来往明显变少', '宿舍或同学反映有异常', '据你所知近期有重大变故'] : ['近期出勤明显变少', '作业或考试缺交', '和同学来往明显变少', '近期有重大变故（家庭、学业、感情）', '宿舍或同学反映有异常'];
const opts = (key, arr, dis = []) => `<div class="opts">${arr.map(x => `<button class="${S.form[key] === x ? 'on' : ''}" ${dis.includes(x) ? 'disabled' : `data-act="fset" data-arg="${key}|${x}"`}>${x}</button>`).join('')}</div>`;
const ta = (key = 'note', ph = '') => `<textarea data-bind="form.${key}" placeholder="${ph}">${esc(S.form[key] || '')}</textarea>`;
const fld = (label, inner) => `<div class="fld"><label>${label}</label>${inner}</div>`;
const openSlots = c => { const r = []; SCHED[c].forEach((d, di) => d.forEach((v, ti) => { if (v === 'open' && !(di === 0 && ti < 2)) r.push(`${di}-${ti}`); })); return r; };
const slotPick = c => `<div class="opts">${openSlots(c).map(k => { const [d, t] = k.split('-').map(Number); return `<button class="${S.form.slot === k ? 'on' : ''}" data-act="fset" data-arg="slot|${k}">${dayLbl(d)} ${TIMES[t]}</button>`; }).join('') || '<span class="note">这位咨询师本周没有开放时段</span>'}</div>`;
function modal() {
  const [k, rest] = S.mo.split(':'), id = rest || '', s = SU(id), F = S.form;
  const box = (h, p, body, ok, okAct, danger) => `<div class="ov" data-act="ovClose"><div class="mo"><h3>${h}</h3>${p ? `<p>${p}</p>` : ''}${body}<div class="acts"><button class="btn sec" data-act="moClose">取消</button>${ok ? `<button class="btn ${danger ? 'red' : 'pri'}" data-act="${okAct}" data-arg="${esc(id)}">${ok}</button>` : ''}</div></div></div>`;
  if (k === 'verify') { const its = OBS(), obs = F.obs || {}, anyY = its.some(x => obs[x] === '有'), left = its.filter(x => !obs[x]).length;
    return `<div class="ov" data-act="ovClose"><div class="mo"><h3>核验 · ${nm(s)}</h3><p>${s.college} · ${s.year} · 完成普测 ${fmt(s.done)}${s.quality ? ` · <span class="pill w">${s.quality}</span>` : ''}</p>
      ${S.role === 'L1' && s.dirs.length ? fld('系统提示需要留意的方面（只显示方向，不含等级和分数）', `<div>${tags(s.dirs)}</div>`) : ''}
      <div class="fld"><label>对照你${S.role === 'L1s' ? '在同学中' : '平时'}观察到的情况</label><table class="t obs">${its.map(x => `<tr><td>${x}</td><td>${['有', '没有', '不清楚'].map(v => `<button class="${obs[x] === v ? 'on' : ''} ${v === '有' ? 'y' : ''}" data-act="obs" data-arg="${x}|${v}">${v}</button>`).join('')}</td></tr>`).join('')}</table></div>
      ${fld('补充（选填）', ta('note', '例如：这周两次没来上课，微信回复很慢'))}
      ${anyY ? '<p class="note" style="color:var(--warn)">你观察到了异常，建议「存疑上推」，由咨询师来复核。</p>' : left ? `<p class="note">还有 ${left} 项没选；不清楚也可以选「不清楚」。</p>` : '<p class="note">没有观察到异常，可以维持。</p>'}
      <div class="acts"><button class="btn sec" data-act="moClose">取消</button><button class="btn ${anyY ? 'sec' : 'pri'}" data-act="verifyKeep" data-arg="${id}" ${left ? 'disabled' : ''}>维持</button><button class="btn ${anyY ? 'pri' : 'sec'}" data-act="verifyUp" data-arg="${id}">存疑上推</button></div></div></div>`; }
  if (k === 'up1') return box('存疑上推到 L2', `${nm(s)} 会进入 L2 待复核。上推不需要理由充分，拿不准就推。`, fld('原因', opts('why', ['状态比看起来更差', '近期重大变故', '作答不认真', '其他'])) + fld('补充观察（选填）', ta('note', '例如：最近家里有变故，上课常缺席')), '上推', 'up1Ok');
  if (k === 'fb') return box('写随访反馈', `${nm(s)}${isL1() ? '' : ` · 随访周期 ${s.cycle === 1 ? '24 小时' : (s.cycle || 14) + ' 天'}`}${s.miss ? ` · 已连续未接通 ${s.miss} 次` : ''}`, fld('联系结果', opts('res', ['已联系', '未接通', '学生不愿多聊'])) + (F.res === '未接通' ? '<p class="note">未接通不算完成：24 小时后再次提醒，连续 3 次未接通会上推到 L2。</p>' : fld('风险趋势', opts('trend', ['好转', '持平', '加重'])) + '<p class="note">选「加重」会立即进入 L2 待复核。</p>') + fld('补充观察', ta()), '提交', 'fbOk');
  if (k === 'conf') { const cur = curLv(s);
    return box(`${S.role === 'L3' && ['L1', 'L2'].includes(s.stage) ? '代办：' : ''}确认 / 调整等级`, `系统初判 ${s.ai} 级${s.conf ? `，当前已确认 ${s.conf} 级` : ''}。等级与初判不同必须写原因；从 4 级及以上往下调，需要 L3 审批；选 5 级会立即转入危机通道。`,
      fld('确认等级', opts('lv', ['5', '4', '3', '2', '1'])) + (F.lv === '5' ? '<p class="note" style="color:var(--crit)">确认后立即转入危机通道，短信通知值班咨询师。</p>' : S.role !== 'L3' && cur >= 4 && +F.lv < cur ? '<p class="note" style="color:var(--warn)">这是从 4 级及以上往下调，提交后进入 L3 降级审批，审批前不生效。</p>' : '') +
      fld(`原因${F.lv && +F.lv !== s.ai ? '（必填）' : '（与初判一致可不填）'}`, ta()) + (F.lv === '5' ? '' : fld('后续', opts('next', [activeBook(s) ? '已有预约，无需邀请' : '邀请预约', '常规随访', '直接指派咨询师']))), '确认', 'confOk', F.lv === '5'); }

function briefImage() {
  S.maskAll = true; const b = briefData(); S.maskAll = false;
  const strip = h => String(h).replace(/<span class="hint">.*?<\/span>/g, '').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
  const W = 900, P = 40, cv = document.createElement('canvas'), x = cv.getContext('2d'), F = '"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';
  const lines = []; const push = (t, f, c, gap) => lines.push({ t, f, c, gap: gap || 0 });
  push(`${greet()}。${strip(b.lead)}`, `500 19px ${F}`, '#2E3A3C', 6);
  b.secs.forEach((s, i) => { push(`${i + 1}. ${strip(s.t)}`, `600 17px ${F}`, s.red ? '#B4432E' : '#2F5D62', 14); s.items.forEach(it => push('· ' + strip(it.html), `400 15.5px ${F}`, '#3d4a4c', 4)); });
  push(strip(b.foot), `400 13.5px ${F}`, '#6F7A7D', 16);
  const wrap = (t, f) => { x.font = f; const out = []; let cur = ''; for (const ch of t) { if (x.measureText(cur + ch).width > W - P * 2 - 10) { out.push(cur); cur = ch; } else cur += ch; } if (cur) out.push(cur); return out; };
  cv.width = W; cv.height = 4000; let y = 120; const draw = [];
  lines.forEach(l => { y += l.gap; wrap(l.t, l.f).forEach(t => { y += parseFloat(l.f.split(' ')[1]) * 1.65; draw.push([t, l.f, l.c, y]); }); });
  const H = y + 90; cv.height = H;
  x.fillStyle = '#FFFDF3'; x.fillRect(0, 0, W, H); x.fillStyle = '#1E3337'; x.fillRect(0, 0, W, 84);
  x.fillStyle = '#F2C14E'; x.font = `700 24px ${F}`; x.fillText('小屿 · 今日简报', P, 48); x.fillStyle = '#DDE6E4'; x.font = `400 14px ${F}`; x.fillText(`${ST(me()).name} · ${RN[S.role]} · 按 ${fmt(NOW)} 的数据`, P, 70);
  draw.forEach(([t, f, c, yy]) => { x.font = f; x.fillStyle = c; x.fillText(t, P, yy); });
  x.save(); x.globalAlpha = .07; x.fillStyle = '#2F5D62'; x.font = `600 22px ${F}`; x.rotate(-Math.PI / 9); for (let yy = 0; yy < H + 400; yy += 140) for (let xx = -200; xx < W + 200; xx += 360) x.fillText('内部资料 · 请勿外传', xx, yy); x.restore();
  x.fillStyle = '#E4E8E3'; x.fillRect(0, H - 50, W, 50); x.fillStyle = '#6F7A7D'; x.font = `400 13px ${F}`; x.fillText(`内部资料 · 请勿外传 · 学生姓名已脱敏 · 由 ${ST(me()).name} 分享于 ${fmt(NOW)} · 灵屿 2.0`, P, H - 20);
  return cv;
}

Object.assign(ACT, {

  reviewSave(id) { const p = planOf(id); p.review.notes = S.planNotes ?? p.review.notes; log(`保存复盘笔记：${p.name}`, null, { obj: '施测方案' }); toast('已保存，新建方案时会提示'); },

/* =====================================================================
   全组排班（L3）：月度总览 → 点开某人某周看细节 → L3 可调整并同步给本人
   每位咨询师在自己的「排班」里提交本人时段；本周数据与预约共用同一份
===================================================================== */
const SC = ['c1', 'c2', 'c3', 'c4', 'c5'];
const dkey = d => `${d.getMonth() + 1}/${d.getDate()}`;
const SCHM = {};
SC.forEach((c, ci) => { SCHM[c] = {};
  [9, 10].forEach(m => { for (let day = 1; day <= 31; day++) { const d = new Date(2026, m, day); if (d.getMonth() !== m || [0, 6].includes(d.getDay())) continue;
    const di = DAYS.findIndex(x => dkey(x) === dkey(d)); SCHM[c][dkey(d)] = di >= 0 ? SCHED[c][di] : TIMES.map((_, ti) => ((ci + day + ti) % 3 === 0 ? 'off' : 'open')); } }); });
const monday = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const isPast = d => d < new Date(2026, 9, 12);
function schedGroup() {
  const m = S.mon ?? 9, days = Object.keys(SCHM.c1).filter(k => +k.split('/')[0] === m + 1).map(k => new Date(2026, m, +k.split('/')[1]));
  const today = dkey(NOW), wk = DAYS.map(dkey), sel = S.schSel;
  const cell = (c, d) => { const k = dkey(d), a = SCHM[c][k], o = a.filter(v => v === 'open').length, b = a.filter(v => v === 'bk').length, past = isPast(d), on = sel && sel.c === c && monday(new Date(2026, +sel.k.split('/')[0] - 1, +sel.k.split('/')[1])).getTime() === monday(d).getTime();
    return `<td class="mc ${past ? 'past' : ''} ${on ? 'on' : ''} ${wk.includes(k) ? 'wk' : ''}" ${past ? '' : `data-act="schPick" data-arg="${c}|${k}"`} title="${ST(c).name} ${k}：开放 ${o}，已约 ${b}"><i style="opacity:${past ? .25 : .25 + o * .19}"></i><span>${o}${b ? `<b>·${b}</b>` : ''}</span></td>`; };
  let detail = '';
  if (sel) { const st = monday(new Date(2026, +sel.k.split('/')[0] - 1, +sel.k.split('/')[1])), wd = [0, 1, 2, 3, 4].map(i => { const d = new Date(st); d.setDate(st.getDate() + i); return d; }).filter(d => SCHM[sel.c][dkey(d)]);
    const dr = S.mdraft || {}, val = (k, ti) => (dr[k] || SCHM[sel.c][k])[ti], n = Object.keys(dr).reduce((a, k) => a + dr[k].filter((v, i) => v !== SCHM[sel.c][k][i]).length, 0);
    detail = `<div class="card mdetail"><h3>${photo(sel.c)}${ST(sel.c).name} · ${dkey(wd[0])}–${dkey(wd[wd.length - 1])} 的排班<span class="sp"></span><small>${ST(sel.c).title} · ${STAFF[sel.c].pre ? '接待预咨询' : '不接待预咨询'}</small><button class="btn ghost xs" data-act="schClose">${I('x', 's')}</button></h3>
      <div class="sch" style="grid-template-columns:70px repeat(${wd.length},1fr)"><div></div>${wd.map(d => `<div class="hd">${dkey(d)} 周${'日一二三四五六'[d.getDay()]}</div>`).join('')}${TIMES.map((t, ti) => `<div class="hd">${t}</div>${wd.map(d => { const k = dkey(d), v = val(k, ti), past = isPast(d) || (k === today && ti < 2);
        return v === 'bk' ? '<button class="bk" title="已有预约，要先改约">已预约</button>' : past ? '<button disabled class="past">已过</button>' : `<button class="${v === 'open' ? 'open' : ''} ${dr[k] && dr[k][ti] !== SCHM[sel.c][k][ti] ? 'chg' : ''}" data-act="mslot" data-arg="${k}|${ti}">${v === 'open' ? '开放' : '关闭'}</button>`; }).join('')}`).join('')}</div>
      <div class="wfoot"><span class="note">${n ? `<b style="color:var(--warn)">调整了 ${n} 处</b>，保存后会同步到${ST(sel.c).name}的排班，并通知她 / 他` : `这是${ST(sel.c).name}自己提交的排班；你可以直接调整，保存后同步给本人。`}</span><span class="sp"></span>${n ? '<button class="btn ghost" data-act="mDiscard">放弃</button>' : ''}<button class="btn pri" data-act="mSave" ${n ? '' : 'disabled'}>保存并同步给${ST(sel.c).name}</button></div></div>`; }
  return `<div class="card"><h3>${I('cal')}全组排班 · 2026 年 ${m + 1} 月<span class="sp"></span><button class="btn ghost xs" data-act="mon" data-arg="9" ${m === 9 ? 'disabled' : ''}>${I('left', 's')}10 月</button><button class="btn ghost xs" data-act="mon" data-arg="10" ${m === 10 ? 'disabled' : ''}>11 月${I('right', 's')}</button></h3>

Object.assign(ACT, {
  mon(m) { S.mon = +m; S.schSel = null; S.mdraft = null; },

const QUICK = [['c5', 'L3'], ['c4', 'L3'], ['c1', 'L2'], ['u1', 'L1'], ['u3', 'L1s'], ['a1', 'ADM']];
const ZAPS = [['zCrisis', '新危机'], ['zTime', '时间 +4 小时'], ['zWave', '又有 6 人完成'], ['zBook', '学生提交 2 个预约']];
function boot() {
  $('#roleSel').innerHTML = '<option value="">登录页（未登录）</option>' + QUICK.map(([u, r]) => `<option value="${u}|${r}">${ST(u).name} · ${RN[r]}</option>`).join('');
  $('#zaps').innerHTML = ZAPS.map(([a, n]) => `<button class="zap" data-act="${a}">⚡ ${n}</button>`).join('');
  $('#roleSel').onchange = e => { const v = e.target.value; if (!v) { if (S.uid) ACT.logout(); } else { if (S.uid) log('退出登录', null, { cat: '登录' }); const [u, r] = v.split('|'); enter(u, r, '演示快速登录'); } render(); };
  $('#jump').onchange = e => { go(e.target.value); render(); };
  $('#zapT').onchange = e => document.body.classList.toggle('demo-on', e.target.checked);
  $('#memoBtn').onclick = () => { S.memo = !S.memo; renderShell(); };
  $('#resetBtn').onclick = () => location.reload();
  render();
}
function renderShell() {
  $('#roleSel').value = S.uid ? `${S.uid}|${S.role}` : '';
  $('#jump').innerHTML = S.uid ? MENUS[S.role].map(([k, n]) => `<option value="${k}" ${S.page === k ? 'selected' : ''}>${n}</option>`).join('') : '<option>—</option>';
  $('#jump').disabled = !S.uid;
  const m = S.uid ? (MEMO[S.role] || {})[S.page] : MEMO.login;
  $('#memo').innerHTML = S.memo ? `<div class="memo"><h4>📝 ${S.uid ? `${RN[S.role]} · ${TITLES[S.page]}` : '登录'}</h4>${m ? `<ul>${m.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p>这一页没有额外说明。</p>'}</div>` : '';
}

boot();</script></body></html>
